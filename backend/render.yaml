services:
  - type: web
    name: sfcollab-task-priority-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python train.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
